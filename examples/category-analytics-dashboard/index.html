<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Category Click Analytics</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f8fb;
      --panel: #ffffff;
      --text: #172033;
      --muted: #5d667a;
      --line: #e5e8ef;
      --accent: #2563eb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    header,
    main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 12px 24px 32px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 32px;
    }

    p {
      margin: 0;
      color: var(--muted);
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-top: 18px;
    }

    button {
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: #ffffff;
      cursor: pointer;
      font-weight: 700;
      padding: 10px 14px;
    }

    button.secondary {
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
    }

    .download-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .download-actions a {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--accent);
      font-size: 14px;
      font-weight: 700;
      padding: 9px 12px;
      text-decoration: none;
    }

    .ip-links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .ip-links button {
      max-width: 100%;
      overflow: hidden;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--text);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 24px;
      align-items: stretch;
    }

    .panel {
      min-height: 420px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      padding: 18px 20px 20px;
    }

    .panel-wide {
      grid-column: 1 / -1;
      min-height: 500px;
    }

    .panel h2 {
      margin: 0 0 12px;
      font-size: 18px;
    }

    canvas {
      width: 100% !important;
      height: 340px !important;
    }

    .panel-wide canvas {
      height: 420px !important;
    }

    #status {
      font-size: 14px;
    }

    #filter-pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-top: 12px;
      padding: 8px 10px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      color: var(--muted);
      font-size: 14px;
    }

    #filter-pill[hidden] {
      display: none;
    }

    @media (max-width: 820px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .panel-wide {
        grid-column: auto;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Category Click Analytics</h1>
    <p>Shows category clicks, click trends, and clicks grouped by client IP.</p>
    <div class="toolbar">
      <p id="status" aria-live="polite">Loading analytics...</p>
      <button id="refresh-button" type="button">Refresh</button>
    </div>
    <div id="filter-pill" hidden>
      <span id="filter-text"></span>
      <button class="secondary" id="clear-filter-button" type="button">Clear IP filter</button>
    </div>
    <div class="download-actions" aria-label="Download analytics data">
      <a id="download-json" href="#">Download JSON</a>
      <a id="download-csv" href="#">Download CSV</a>
      <a id="download-parquet" href="#">Download Parquet</a>
    </div>
  </header>

  <main>
    <section class="grid" aria-label="Category click charts">
      <div class="panel">
        <h2>Clicks per Category</h2>
        <canvas id="totals-chart"></canvas>
      </div>

      <div class="panel">
        <h2>Clicks per IP</h2>
        <canvas id="ip-chart"></canvas>
        <div class="ip-links" id="ip-links"></div>
      </div>

      <div class="panel panel-wide">
        <h2>Click Trend</h2>
        <canvas id="evolution-chart"></canvas>
      </div>
    </section>
  </main>

  <script>
    // Replace this with the CategoryAnalyticsFunctionUrl output after deployment.
    const analyticsUrl = "https://wdno3zdhcynrbpave2miz6ujj40qrhko.lambda-url.us-east-1.on.aws/";
    const statusText = document.getElementById("status");
    const refreshButton = document.getElementById("refresh-button");
    const filterPill = document.getElementById("filter-pill");
    const filterText = document.getElementById("filter-text");
    const clearFilterButton = document.getElementById("clear-filter-button");
    const ipLinks = document.getElementById("ip-links");
    const downloadJson = document.getElementById("download-json");
    const downloadCsv = document.getElementById("download-csv");
    const downloadParquet = document.getElementById("download-parquet");
    let selectedIp = new URLSearchParams(window.location.search).get("source_ip") || "";
    let totalsChart;
    let evolutionChart;
    let ipChart;
    const ipColors = ["#16a34a", "#2563eb", "#dc2626", "#9333ea", "#ea580c", "#0891b2", "#be123c", "#4f46e5"];

    refreshButton.addEventListener("click", loadAnalytics);
    clearFilterButton.addEventListener("click", () => {
      selectedIp = "";
      updateUrlFilter();
      updateDownloadLinks();
      loadAnalytics();
    });
    updateDownloadLinks();
    loadAnalytics();

    async function loadAnalytics() {
      statusText.textContent = "Loading analytics...";

      try {
        const response = await fetch(buildAnalyticsUrl());
        const data = await response.json();
        renderTotalsChart(data.totals || []);
        renderEvolutionChart(data.evolution || []);
        renderIpChart(data.clicks_by_ip || []);
        renderFilter(data.selected_ip || "");
        statusText.textContent = `Updated at ${new Date().toLocaleTimeString()}`;
      } catch (error) {
        statusText.textContent = "Analytics could not be loaded.";
        console.warn("Analytics request failed.", error);
      }
    }

    function renderTotalsChart(totals) {
      const labels = totals.map((item) => item.category);
      const values = totals.map((item) => item.clicks);

      if (totalsChart) {
        totalsChart.destroy();
      }

      totalsChart = new Chart(document.getElementById("totals-chart"), {
        type: "bar",
        data: {
          labels,
          datasets: [{
            label: "Clicks",
            data: values,
            backgroundColor: "#2563eb",
          }],
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          layout: {
            padding: {
              top: 8,
              right: 12,
              bottom: 4,
              left: 8,
            },
          },
          plugins: {
            legend: {
              position: "top",
              labels: {
                boxWidth: 42,
              },
            },
            tooltip: {
              enabled: true,
              mode: "nearest",
              intersect: false,
            },
          },
          interaction: {
            mode: "nearest",
            intersect: false,
          },
          scales: {
            x: {
              ticks: {
                maxRotation: 30,
                minRotation: 30,
                callback: function(value) {
                  return shortenLabel(this.getLabelForValue(value), 14);
                },
              },
            },
            y: {
              beginAtZero: true,
              ticks: { precision: 0 },
            },
          },
        },
      });
    }

    function renderEvolutionChart(evolution) {
      const buckets = [...new Set(evolution.map((item) => item.bucket_start))];
      const categories = [...new Set(evolution.map((item) => item.category))];
      const colors = ["#2563eb", "#16a34a", "#dc2626", "#9333ea", "#ea580c", "#0891b2", "#be123c", "#4f46e5"];

      const datasets = categories.map((category, index) => ({
        label: category,
        data: buckets.map((bucket) => {
          const item = evolution.find((entry) => entry.bucket_start === bucket && entry.category === category);
          return item ? item.clicks : 0;
        }),
        borderColor: colors[index % colors.length],
        backgroundColor: colors[index % colors.length],
        pointRadius: 5,
        pointHoverRadius: 8,
        pointHitRadius: 16,
        borderWidth: 3,
        tension: 0.25,
      }));

      if (evolutionChart) {
        evolutionChart.destroy();
      }

      evolutionChart = new Chart(document.getElementById("evolution-chart"), {
        type: "line",
        data: {
          labels: buckets.map((bucket) => new Date(bucket).toLocaleTimeString()),
          datasets,
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          layout: {
            padding: {
              top: 8,
              right: 12,
              bottom: 4,
              left: 8,
            },
          },
          plugins: {
            legend: {
              position: "top",
              labels: {
                boxWidth: 42,
              },
            },
            tooltip: {
              enabled: true,
              mode: "nearest",
              intersect: false,
            },
          },
          interaction: {
            mode: "nearest",
            intersect: false,
          },
          scales: {
            y: {
              beginAtZero: true,
              ticks: { precision: 0 },
            },
          },
        },
      });
    }

    function renderIpChart(clicksByIp) {
      const labels = clicksByIp.map((item) => item.source_ip);
      const values = clicksByIp.map((item) => item.clicks);
      const colors = clicksByIp.map((_item, index) => ipColors[index % ipColors.length]);
      renderIpLinks(clicksByIp);

      if (ipChart) {
        ipChart.destroy();
      }

      ipChart = new Chart(document.getElementById("ip-chart"), {
        type: "bar",
        data: {
          labels,
          datasets: [{
            label: "Clicks",
            data: values,
            backgroundColor: colors,
          }],
        },
        options: {
          onClick: (_event, elements) => {
            if (!elements.length) {
              return;
            }

            const index = elements[0].index;
            selectedIp = clicksByIp[index].source_ip;
            updateUrlFilter();
            updateDownloadLinks();
            loadAnalytics();
          },
          onHover: (event, elements) => {
            event.native.target.style.cursor = elements.length ? "pointer" : "default";
          },
          indexAxis: "y",
          responsive: true,
          maintainAspectRatio: false,
          layout: {
            padding: {
              top: 8,
              right: 12,
              bottom: 4,
              left: 16,
            },
          },
          plugins: {
            legend: {
              position: "top",
              labels: {
                boxWidth: 42,
              },
            },
          },
          scales: {
            y: {
              ticks: {
                callback: function(value) {
                  return shortenIpLabel(this.getLabelForValue(value));
                },
              },
            },
            x: {
              beginAtZero: true,
              ticks: { precision: 0 },
            },
          },
        },
      });
    }

    function renderIpLinks(clicksByIp) {
      ipLinks.innerHTML = "";

      clicksByIp.forEach((item, index) => {
        const color = ipColors[index % ipColors.length];
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = `${item.source_ip} (${item.clicks})`;
        button.title = `Show dashboard for ${item.source_ip}`;
        button.style.borderColor = color;
        button.style.color = color;
        button.addEventListener("click", () => {
          selectedIp = item.source_ip;
          updateUrlFilter();
          updateDownloadLinks();
          loadAnalytics();
        });
        ipLinks.appendChild(button);
      });
    }

    function buildAnalyticsUrl() {
      if (!selectedIp) {
        return analyticsUrl;
      }

      const url = new URL(analyticsUrl);
      url.searchParams.set("source_ip", selectedIp);
      return url.toString();
    }

    function renderFilter(activeIp) {
      if (!activeIp) {
        filterPill.hidden = true;
        return;
      }

      filterText.textContent = `Showing dashboard for IP: ${activeIp}`;
      filterPill.hidden = false;
    }

    function updateUrlFilter() {
      const url = new URL(window.location.href);

      if (selectedIp) {
        url.searchParams.set("source_ip", selectedIp);
      } else {
        url.searchParams.delete("source_ip");
      }

      window.history.replaceState({}, "", url);
    }

    function updateDownloadLinks() {
      downloadJson.href = buildDownloadUrl("json");
      downloadCsv.href = buildDownloadUrl("csv");
      downloadParquet.href = buildDownloadUrl("parquet");
    }

    function buildDownloadUrl(format) {
      const url = new URL(analyticsUrl);
      url.searchParams.set("format", format);

      if (selectedIp) {
        url.searchParams.set("source_ip", selectedIp);
      }

      return url.toString();
    }

    function shortenLabel(label, maxLength) {
      return label.length > maxLength ? `${label.slice(0, maxLength - 1)}...` : label;
    }

    function shortenIpLabel(label) {
      return label.length > 22 ? `...${label.slice(-22)}` : label;
    }
  </script>
</body>
</html>
