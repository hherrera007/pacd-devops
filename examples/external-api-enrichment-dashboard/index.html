<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>External API Comparison Dashboard</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f8fb;
      --panel: #ffffff;
      --text: #172033;
      --muted: #5d667a;
      --line: #e5e8ef;
      --accent: #2563eb;
      --accent-dark: #1d4ed8;
      --success: #15803d;
      --danger: #b91c1c;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    header,
    main {
      max-width: 1180px;
      margin: 0 auto;
      padding: 16px 24px 32px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 32px;
    }

    p {
      margin: 0;
      color: var(--muted);
    }

    label {
      display: block;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
    }

    input,
    select,
    button {
      min-height: 42px;
      border-radius: 8px;
      font: inherit;
    }

    input,
    select {
      width: 100%;
      border: 1px solid var(--line);
      background: #ffffff;
      color: var(--text);
      padding: 9px 10px;
    }

    button {
      border: 0;
      background: var(--accent);
      color: #ffffff;
      cursor: pointer;
      font-weight: 700;
      padding: 10px 16px;
    }

    button:hover {
      background: var(--accent-dark);
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.65;
    }

    .controls {
      display: grid;
      grid-template-columns: minmax(260px, 1fr) minmax(180px, 260px) auto;
      gap: 14px;
      align-items: end;
      margin-top: 20px;
    }

    .status {
      margin-top: 14px;
      color: var(--muted);
      font-size: 14px;
    }

    .status.ok {
      color: var(--success);
    }

    .status.error {
      color: var(--danger);
    }

    .source-errors {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
      margin-top: 14px;
    }

    .source-error {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      padding: 12px;
      color: var(--muted);
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .source-error strong {
      display: block;
      margin-bottom: 4px;
      color: var(--text);
    }

    .source-counts {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .source-counts span {
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel);
      color: var(--muted);
      font-size: 13px;
      padding: 6px 10px;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      margin-bottom: 22px;
    }

    .metric,
    .panel {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
    }

    .metric {
      padding: 16px;
    }

    .metric span {
      display: block;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .metric strong {
      display: block;
      margin-top: 8px;
      overflow-wrap: anywhere;
      font-size: 20px;
    }

    .panel {
      padding: 18px;
    }

    .panel h2 {
      margin: 0 0 14px;
      font-size: 20px;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 16px;
    }

    .product-card {
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
      background: #ffffff;
    }

    .product-card header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
    }

    .product-card header strong {
      color: var(--muted);
      font-size: 14px;
    }

    .comparison {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0;
    }

    .source {
      min-width: 0;
      padding: 14px;
    }

    .source + .source {
      border-left: 1px solid var(--line);
    }

    .source h3 {
      margin: 0 0 10px;
      font-size: 15px;
    }

    .source img {
      width: 100%;
      height: 160px;
      border-radius: 8px;
      background: #eef1f6;
      object-fit: contain;
    }

    .carousel {
      display: grid;
      grid-template-columns: 36px 1fr 36px;
      gap: 8px;
      align-items: center;
    }

    .carousel button {
      min-height: 36px;
      padding: 0;
    }

    .carousel-count {
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
      text-align: center;
    }

    .source dl {
      margin: 12px 0 0;
    }

    .source dt {
      margin-top: 10px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .source dd {
      margin: 4px 0 0;
      overflow-wrap: anywhere;
    }

    .empty {
      border: 1px dashed var(--line);
      border-radius: 8px;
      padding: 24px;
      color: var(--muted);
      text-align: center;
    }

    pre {
      max-height: 360px;
      overflow: auto;
      border-radius: 8px;
      background: #101827;
      color: #e5e7eb;
      padding: 14px;
      white-space: pre-wrap;
    }

    @media (max-width: 760px) {
      .controls,
      .summary,
      .comparison {
        grid-template-columns: 1fr;
      }

      .source + .source {
        border-top: 1px solid var(--line);
        border-left: 0;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>External API Comparison Dashboard</h1>
    <p>Calls the enrichment Lambda, compares category results from two public APIs, and stores the result in S3.</p>

    <section class="controls" aria-label="Enrichment controls">
      <div>
        <label for="function-url">ExternalApiEnrichmentFunctionUrl</label>
        <input id="function-url" type="url" value="https://qaayfl6gvtfqc7dwxuwdc3nili0tzhfs.lambda-url.us-east-1.on.aws/" spellcheck="false">
      </div>

      <div>
        <label for="category">Category</label>
        <select id="category">
          <option>Electronics</option>
          <option>Fashion</option>
          <option>Home & Kitchen</option>
          <option>Sports & Outdoors</option>
          <option>Books</option>
          <option>Toys & Games</option>
          <option>Beauty & Personal Care</option>
          <option>Pet Supplies</option>
        </select>
      </div>

      <button id="run-button" type="button">Run Comparison</button>
    </section>

    <p class="status" id="status" aria-live="polite">Ready.</p>
    <div class="source-counts" id="source-counts" hidden></div>
    <div class="source-errors" id="source-errors" hidden></div>
  </header>

  <main>
    <section class="summary" aria-label="Enrichment summary">
      <div class="metric">
        <span>Category</span>
        <strong id="summary-category">-</strong>
      </div>
      <div class="metric">
        <span>Compared Products</span>
        <strong id="summary-count">0</strong>
      </div>
      <div class="metric">
        <span>S3 Object Key</span>
        <strong id="summary-s3-key">-</strong>
      </div>
    </section>

    <section class="panel">
      <h2>Product Comparison</h2>
      <div id="products" class="product-grid">
        <div class="empty">Run the comparison to see products from both APIs.</div>
      </div>
    </section>

    <section class="panel" style="margin-top: 22px;">
      <h2>Raw Lambda Response</h2>
      <pre id="raw-response">{}</pre>
    </section>
  </main>

  <script>
    const functionUrlInput = document.getElementById("function-url");
    const categorySelect = document.getElementById("category");
    const runButton = document.getElementById("run-button");
    const statusText = document.getElementById("status");
    const sourceCounts = document.getElementById("source-counts");
    const sourceErrors = document.getElementById("source-errors");
    const summaryCategory = document.getElementById("summary-category");
    const summaryCount = document.getElementById("summary-count");
    const summaryS3Key = document.getElementById("summary-s3-key");
    const productsContainer = document.getElementById("products");
    const rawResponse = document.getElementById("raw-response");

    runButton.addEventListener("click", runEnrichment);

    async function runEnrichment() {
      const functionUrl = functionUrlInput.value.trim();
      const category = categorySelect.value;

      if (!functionUrl || functionUrl.includes("REPLACE_WITH")) {
        setStatus("Replace the Function URL before running the dashboard.", "error");
        return;
      }

      runButton.disabled = true;
      setStatus("Calling external APIs and storing the comparison payload in S3...", "");

      try {
        const response = await fetch(functionUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ category }),
        });
        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.message || "The enrichment Lambda returned an error.");
        }

        renderSummary(data);
        renderSourceCounts(data.source_counts || {});
        renderSourceMessages(data.source_errors || {}, data.source_warnings || {});
        renderProducts(data.comparisons || []);
        rawResponse.textContent = JSON.stringify(data, null, 2);
        setStatus(`Stored ${data.comparison_count || 0} comparison records in S3.`, "ok");
      } catch (error) {
        setStatus(error.message || "The enrichment request failed.", "error");
        console.warn("External API enrichment failed.", error);
      } finally {
        runButton.disabled = false;
      }
    }

    function renderSourceCounts(counts) {
      const entries = Object.entries(counts);

      if (!entries.length) {
        sourceCounts.hidden = true;
        sourceCounts.innerHTML = "";
        return;
      }

      sourceCounts.hidden = false;
      sourceCounts.innerHTML = entries.map(([source, count]) => `
        <span>${escapeHtml(source)} matches: ${Number(count) || 0}</span>
      `).join("");
    }

    function renderSourceMessages(errors, warnings) {
      const entries = [
        ...Object.entries(errors).filter(([, message]) => message),
        ...Object.entries(warnings).filter(([, message]) => message),
      ];

      if (!entries.length) {
        sourceErrors.hidden = true;
        sourceErrors.innerHTML = "";
        return;
      }

      sourceErrors.hidden = false;
      sourceErrors.innerHTML = entries.map(([source, message]) => `
        <div class="source-error">
          <strong>${escapeHtml(source)}</strong>
          ${escapeHtml(message)}
        </div>
      `).join("");
    }

    function renderSummary(data) {
      summaryCategory.textContent = data.category || "-";
      summaryCount.textContent = data.comparison_count ?? 0;
      summaryS3Key.textContent = data.s3_key || "-";
    }

    function renderProducts(products) {
      productsContainer.innerHTML = "";

      if (!products.length) {
        productsContainer.innerHTML = '<div class="empty">No products were returned for this category.</div>';
        return;
      }

      products.forEach((item, index) => {
        const card = document.createElement("article");
        card.className = "product-card";
        card.innerHTML = `
          <header>
            <strong>Comparison ${index + 1}</strong>
            <span>${escapeHtml(item.category || "")}</span>
          </header>
          <div class="comparison">
            ${renderSource("API One", item.api_one_product)}
            ${renderSource("API Two", item.api_two_product)}
          </div>
        `;
        productsContainer.appendChild(card);
      });
    }

    function renderSource(label, product) {
      const safeProduct = product || {};

      return `
        <section class="source">
          <h3>${label}</h3>
          ${renderImages(safeProduct.image, safeProduct.title || label)}
          <dl>
            <dt>Title</dt>
            <dd>${escapeHtml(safeProduct.title || "No title")}</dd>
            <dt>Category</dt>
            <dd>${escapeHtml(safeProduct.category || "No category")}</dd>
            <dt>Price</dt>
            <dd>${formatPrice(safeProduct.price)}</dd>
          </dl>
        </section>
      `;
    }

    function renderImages(value, altText) {
      const images = imageList(value);

      if (!images.length) {
        return '<div class="empty">No image</div>';
      }

      const imageId = `product-image-${crypto.randomUUID()}`;
      const countId = `${imageId}-count`;
      const encodedImages = encodeURIComponent(JSON.stringify(images));

      if (images.length === 1) {
        return `<img src="${escapeAttribute(images[0])}" alt="${escapeAttribute(altText)}">`;
      }

      return `
        <div class="carousel" data-images="${encodedImages}" data-index="0">
          <button type="button" aria-label="Previous image" onclick="changeImage(this, -1)">‹</button>
          <img id="${imageId}" src="${escapeAttribute(images[0])}" alt="${escapeAttribute(altText)}">
          <button type="button" aria-label="Next image" onclick="changeImage(this, 1)">›</button>
        </div>
        <div id="${countId}" class="carousel-count">1 / ${images.length}</div>
      `;
    }

    function changeImage(button, direction) {
      const carousel = button.closest(".carousel");
      const images = JSON.parse(decodeURIComponent(carousel.dataset.images));
      const nextIndex = (Number(carousel.dataset.index) + direction + images.length) % images.length;
      const image = carousel.querySelector("img");
      const counter = carousel.nextElementSibling;

      carousel.dataset.index = String(nextIndex);
      image.src = images[nextIndex];
      counter.textContent = `${nextIndex + 1} / ${images.length}`;
    }

    function imageList(value) {
      if (Array.isArray(value)) {
        return value.filter(Boolean);
      }
      return value ? [value] : [];
    }

    function formatPrice(value) {
      if (value === null || value === undefined || value === "") {
        return "No price";
      }
      const numberValue = Number(value);
      return Number.isFinite(numberValue) ? `$${numberValue.toFixed(2)}` : escapeHtml(String(value));
    }

    function setStatus(message, type) {
      statusText.textContent = message;
      statusText.className = `status ${type}`.trim();
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, (character) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#039;",
      }[character]));
    }

    function escapeAttribute(value) {
      return escapeHtml(value).replace(/`/g, "&#096;");
    }
  </script>
</body>
</html>
